<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Support Ticket System</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 2rem;
      color: #333;
    }

    h1 {
      color: white;
      text-align: center;
      margin-bottom: 1rem;
      font-size: 2.5rem;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }

    .hint {
      color: rgba(255, 255, 255, 0.9);
      text-align: center;
      margin-bottom: 2rem;
      font-size: 1.1rem;
    }

    #ticket-form {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      max-width: 600px;
      margin: 0 auto 2rem;
    }

    label {
      display: block;
      margin-bottom: 1.5rem;
    }

    label span {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: #555;
    }

    input[type="text"],
    textarea {
      width: 100%;
      padding: 0.75rem;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus,
    textarea:focus {
      outline: none;
      border-color: #667eea;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button[type="submit"] {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button[type="submit"]:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    button[type="submit"]:active {
      transform: translateY(0);
    }

    #result {
      text-align: center;
      padding: 1rem;
      margin-bottom: 1rem;
      border-radius: 8px;
      background: white;
      color: #667eea;
      font-weight: 500;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    #result:empty {
      display: none;
    }

    #queue-table {
      width: 100%;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    }

    #queue-table thead {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    #queue-table th {
      padding: 1rem;
      text-align: left;
      color: white;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
    }

    #queue-table td {
      padding: 1rem;
      border-bottom: 1px solid #f0f0f0;
    }

    #queue-table tbody tr:hover {
      background: #f8f9ff;
    }

    #queue-table tbody tr:last-child td {
      border-bottom: none;
    }

    #queue-table button {
      padding: 0.5rem 1rem;
      margin-right: 0.5rem;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    #queue-table button:first-of-type {
      background: #10b981;
      color: white;
    }

    #queue-table button:first-of-type:hover:not(:disabled) {
      background: #059669;
      transform: translateY(-1px);
    }

    #queue-table button:last-of-type {
      background: #ef4444;
      color: white;
    }

    #queue-table button:last-of-type:hover {
      background: #dc2626;
      transform: translateY(-1px);
    }

    #queue-table button:disabled {
      background: #d1d5db;
      cursor: not-allowed;
      opacity: 0.6;
    }

    /* Modal styles */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .modal-header h2 {
      color: #667eea;
      margin: 0;
    }

    .close-modal {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #999;
      padding: 0;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .close-modal:hover {
      color: #333;
    }

    .messages-list {
      margin-bottom: 1.5rem;
      max-height: 300px;
      overflow-y: auto;
    }

    .message-item {
      background: #f8f9ff;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 0.75rem;
      border-left: 3px solid #667eea;
    }

    .message-author {
      font-weight: 600;
      color: #667eea;
      margin-bottom: 0.25rem;
    }

    .message-text {
      color: #333;
      margin-bottom: 0.25rem;
    }

    .message-date {
      font-size: 0.85rem;
      color: #999;
    }

    .message-form {
      border-top: 2px solid #f0f0f0;
      padding-top: 1.5rem;
    }

    .message-form textarea {
      width: 100%;
      min-height: 80px;
      margin-bottom: 1rem;
    }

    .message-form button {
      width: 100%;
      padding: 0.75rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .message-form button:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    #queue-table button:nth-of-type(3) {
      background: #667eea;
      color: white;
    }

    #queue-table button:nth-of-type(3):hover {
      background: #5568d3;
      transform: translateY(-1px);
    }

    @media (max-width: 768px) {
      body {
        padding: 1rem;
      }

      h1 {
        font-size: 1.8rem;
      }

      #ticket-form {
        padding: 1.5rem;
      }

      #queue-table {
        font-size: 0.9rem;
      }

      #queue-table th,
      #queue-table td {
        padding: 0.75rem 0.5rem;
      }

      #queue-table button {
        padding: 0.4rem 0.8rem;
        font-size: 0.85rem;
        margin-right: 0.25rem;
      }
    }
  </style>
</head>
<body>
  <h1>Support Ticket System</h1>
  <p class="hint">Raise a single support ticket. This adds a new support ticket to your queue, and to which messages can be added.</p>

  <form id="ticket-form">
    <label for="title">
			<span>Title</span>
    	<input type="text" id="title" name="title" placeholder="Subject line" required>
		</label>
		<label for="description">
			<span>Description</span>
			<textarea name="description" id="description" class="description" required></textarea>
		</label>
    <button type="submit">Submit ticket</button>
  </form>

  <div id="result"></div>

  <table id="queue-table">
    <thead>
      <tr>
        <th>Title</th>
        <th>Status</th>
				<th>Created by</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="queue-body"></tbody>
  </table>

  <!-- Messages Modal -->
  <div id="messages-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Ticket Messages</h2>
        <button class="close-modal" onclick="closeMessagesModal()">&times;</button>
      </div>
      <div id="messages-list" class="messages-list"></div>
      <div class="message-form">
        <textarea id="new-message-text" placeholder="Type your message here..."></textarea>
        <button onclick="submitMessage()">Send Message</button>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById("ticket-form");
    const resultEl = document.getElementById("result");
    const queueBody = document.getElementById("queue-body");

    async function loadQueue() {
      try {
        const resp = await fetch("/queue");
        const data = await resp.json();
        if (!resp.ok) {
          resultEl.textContent = "Error loading tickets: " + (data.error || resp.statusText);
          return;
        }
				queueBody.innerHTML = data.map(ticket => {
					return `<tr>
						<td>${ticket.title}</td>
						<td>${ticket.status}</td>
						<td>${ticket.created_by}</td>
						<td>
							<button onclick="closeTicket(${ticket.ticket_id})" ${ticket.status === 'CLOSED' ? 'disabled' : ''}>Close</button>
							<button onclick="deleteTicket(${ticket.ticket_id})">Delete</button>
							<button onclick="openMessagesModal(${ticket.ticket_id}, '${ticket.title}')">Messages</button>
						</td>
					</tr>`;
				}).join('')
      } catch (err) {
        resultEl.textContent = "Failed to load tickets: " + err;
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const title = document.getElementById("title").value;
      const description = document.getElementById("description").value;
      resultEl.textContent = "Adding to queue...";

      try {
        const resp = await fetch("/queue", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title, description }),
        });
        const data = await resp.json();
        if (!resp.ok) {
          resultEl.textContent = "Error: " + (data.error || resp.statusText);
          return;
        }
				resultEl.textContent = `Opened new ticket: ${data.title}`
        document.getElementById("ticket-form").reset();
        loadQueue();
      } catch (err) {
        resultEl.textContent = "Request failed: " + err;
      }
    });

    async function closeTicket(ticketId) {
      if (!confirm('Are you sure you want to close this ticket?')) return;
      
      try {
        const resp = await fetch(`/queue/${ticketId}`, {
          method: "PATCH"
        });
        const data = await resp.json();
        if (!resp.ok) {
          resultEl.textContent = "Error closing ticket: " + (data.error || resp.statusText);
          return;
        }
        resultEl.textContent = "Ticket closed successfully";
        loadQueue();
      } catch (err) {
        resultEl.textContent = "Failed to close ticket: " + err;
      }
    }

    async function deleteTicket(ticketId) {
      if (!confirm('Are you sure you want to delete this ticket? This action cannot be undone.')) return;
      
      try {
        const resp = await fetch(`/queue/${ticketId}`, {
          method: "DELETE"
        });
        const data = await resp.json();
        if (!resp.ok) {
          resultEl.textContent = "Error deleting ticket: " + (data.error || resp.statusText);
          return;
        }
        resultEl.textContent = "Ticket deleted successfully";
        loadQueue();
      } catch (err) {
        resultEl.textContent = "Failed to delete ticket: " + err;
      }
    }

    let currentTicketId = null;

    async function openMessagesModal(ticketId, ticketTitle) {
      currentTicketId = ticketId;
      document.querySelector('.modal-header h2').textContent = `Messages for: ${ticketTitle}`;
      document.getElementById('messages-modal').classList.add('active');
      await loadMessages(ticketId);
    }

    function closeMessagesModal() {
      document.getElementById('messages-modal').classList.remove('active');
      document.getElementById('new-message-text').value = '';
      currentTicketId = null;
    }

    async function loadMessages(ticketId) {
      try {
        const resp = await fetch(`/queue/${ticketId}/messages`);
        const data = await resp.json();
        const messagesList = document.getElementById('messages-list');
        
        if (!resp.ok) {
          messagesList.innerHTML = `<p style="color: red;">Error loading messages: ${data.error || resp.statusText}</p>`;
          return;
        }
        
        if (data.length === 0) {
          messagesList.innerHTML = '<p style="color: #999; text-align: center;">No messages yet. Be the first to add one!</p>';
          return;
        }
        
        messagesList.innerHTML = data.map(msg => {
          const date = new Date(msg.created_at).toLocaleString();
          return `
            <div class="message-item">
              <div class="message-author">${msg.author}</div>
              <div class="message-text">${msg.message_text}</div>
              <div class="message-date">${date}</div>
            </div>
          `;
        }).join('');
      } catch (err) {
        document.getElementById('messages-list').innerHTML = `<p style="color: red;">Failed to load messages: ${err}</p>`;
      }
    }

    async function submitMessage() {
      if (!currentTicketId) return;
      
      const messageText = document.getElementById('new-message-text').value.trim();
      if (!messageText) {
        alert('Please enter a message');
        return;
      }
      
      try {
        const resp = await fetch(`/queue/${currentTicketId}/messages`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message_text: messageText })
        });
        const data = await resp.json();
        
        if (!resp.ok) {
          alert("Error adding message: " + (data.error || resp.statusText));
          return;
        }
        
        document.getElementById('new-message-text').value = '';
        await loadMessages(currentTicketId);
      } catch (err) {
        alert("Failed to add message: " + err);
      }
    }

    loadQueue();
  </script>
</body>
</html>
